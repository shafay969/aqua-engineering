<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 788" role="img" aria-labelledby="title desc">
  <title id="title">Premium kitchen water system</title>
  <desc id="desc">A modern kitchen sink with a stainless faucet, filtered water stream, and under-sink engineering detail.</desc>
  <defs>
    <linearGradient id="wall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.58" stop-color="#e8eef5"/>
      <stop offset="1" stop-color="#dbe6f0"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" x2="1">
      <stop offset="0" stop-color="#7d8795"/>
      <stop offset="0.22" stop-color="#f6f8fb"/>
      <stop offset="0.48" stop-color="#a9b2bf"/>
      <stop offset="0.72" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#6d7887"/>
    </linearGradient>
    <linearGradient id="sink" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="0.48" stop-color="#475569"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="water" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e0f2fe" stop-opacity="0.92"/>
      <stop offset="0.45" stop-color="#60a5fa" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#bfdbfe" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.16"/>
    </filter>
    <pattern id="tile" width="160" height="102" patternUnits="userSpaceOnUse">
      <rect width="160" height="102" fill="none"/>
      <path d="M0 101.5h160M159.5 0v102" stroke="#cbd5e1" stroke-width="1.5" opacity="0.62"/>
    </pattern>
  </defs>

  <rect width="1400" height="788" fill="url(#wall)"/>
